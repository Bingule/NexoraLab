name: Verify AimatraLab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: |
          npm test
          npm run test:tmcc
          npm run typecheck
          npm run check:publication
      # Static export remains a CI link check, never a deployment.
      - run: npm run build
      - run: npm run check:links
